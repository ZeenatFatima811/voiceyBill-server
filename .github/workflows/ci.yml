name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      # Type-checks the test suite too, which the root tsconfig excludes from the
      # build so that dist/ never contains test files.
      - name: Type-check (src + tests)
        run: npm run typecheck

      # No --if-present: the suite is required. If the script goes missing this
      # step must fail rather than quietly pass.
      - name: Run tests
        run: npm test
